name: Deploy geo-strategy-system to ECS

on:
  push:
    branches: [main]
    paths:
      - "geo-strategy-system/**"
      - ".github/workflows/deploy-geo.yml"
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label used for this deployment"
        required: false
        default: "ubuntu-latest"
        type: string

jobs:
  deploy:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload source to ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_SSH_PORT: ${{ secrets.ECS_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          for required in ECS_HOST ECS_USER ECS_SSH_KEY; do
            if [ -z "${!required:-}" ]; then
              echo "::error::$required secret is not configured"
              exit 1
            fi
          done

          PORT="${ECS_SSH_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/geo-strategy-system/geo-system-v1}"
          REMOTE_APP_DIR="${DEPLOY_PATH%/}/geo-strategy-system"
          printf -v REMOTE_APP_DIR_Q '%q' "$REMOTE_APP_DIR"
          KEY_FILE="${RUNNER_TEMP:-$HOME/.ssh}/geo_ecs_key"
          KNOWN_HOSTS_FILE="${RUNNER_TEMP:-$HOME/.ssh}/geo_ecs_known_hosts"
          printf -v KEY_FILE_Q '%q' "$KEY_FILE"
          printf -v KNOWN_HOSTS_FILE_Q '%q' "$KNOWN_HOSTS_FILE"
          SSH_OPTS=(
            -i "$KEY_FILE"
            -p "$PORT"
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE"
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
          )
          SSH_RSYNC="ssh -i $KEY_FILE_Q -p $PORT -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$KNOWN_HOSTS_FILE_Q -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2"

          mkdir -p "$(dirname "$KEY_FILE")"
          printf '%s\n' "$ECS_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          ssh_ok=0
          for attempt in 1 2 3 4 5 6; do
            if ssh "${SSH_OPTS[@]}" "$ECS_USER@$ECS_HOST" true; then
              ssh_ok=1
              break
            fi
            echo "SSH connection failed (attempt $attempt/6); retrying..."
            sleep $((attempt * 10))
          done
          if [ "$ssh_ok" -ne 1 ]; then
            echo "::error::Unable to reach the ECS SSH port. Check the ECS public IP, security group SSH ingress, and instance status."
            exit 1
          fi

          ssh "${SSH_OPTS[@]}" "$ECS_USER@$ECS_HOST" "mkdir -p $REMOTE_APP_DIR_Q"
          upload_ok=0
          for attempt in 1 2 3; do
            if rsync -az --delete \
              --timeout=60 \
              --contimeout=20 \
              --exclude 'node_modules' \
              --exclude '.next' \
              --exclude '.env.local' \
              --exclude '.env.production' \
              -e "$SSH_RSYNC" \
              geo-strategy-system/ "$ECS_USER@$ECS_HOST:$REMOTE_APP_DIR/"; then
              upload_ok=1
              break
            fi
            echo "Source upload failed (attempt $attempt/3); retrying..."
            sleep $((attempt * 10))
          done
          if [ "$upload_ok" -ne 1 ]; then
            echo "::error::Unable to upload source to ECS after retries."
            exit 1
          fi

      - name: Build and restart application
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_SSH_PORT: ${{ secrets.ECS_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          PORT="${ECS_SSH_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/geo-strategy-system/geo-system-v1}"
          KEY_FILE="${RUNNER_TEMP:-$HOME/.ssh}/geo_ecs_key"
          KNOWN_HOSTS_FILE="${RUNNER_TEMP:-$HOME/.ssh}/geo_ecs_known_hosts"
          printf -v DEPLOY_PATH_Q '%q' "$DEPLOY_PATH"

          ssh \
            -i "$KEY_FILE" \
            -p "$PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            "$ECS_USER@$ECS_HOST" \
            "DEPLOY_PATH=$DEPLOY_PATH_Q bash -s" <<'REMOTE_SCRIPT'
            set -euo pipefail
            cd "$DEPLOY_PATH"

            APP_DIR="${DEPLOY_PATH%/}/geo-strategy-system"
            if [ ! -f "$APP_DIR/package.json" ] || ! grep -q '"name"[[:space:]]*:[[:space:]]*"geo-strategy-system"' "$APP_DIR/package.json"; then
              echo "Could not find geo-strategy-system package.json at $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"

            ENV_FILE=""
            for candidate in "$APP_DIR/.env.production" "$APP_DIR/../.env.production" "$DEPLOY_PATH/.env.production" "$DEPLOY_PATH/../.env.production"; do
              if [ -f "$candidate" ]; then
                ENV_FILE="$candidate"
                break
              fi
            done

            if [ -n "$ENV_FILE" ]; then
              set -a
              # shellcheck disable=SC1091
              source "$ENV_FILE"
              set +a
            else
              echo "Warning: .env.production not found; using existing environment"
            fi

            if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
              npm ci --include=dev
            else
              npm install
            fi

            npm run build

            if pm2 describe geo-system > /dev/null; then
              pm2 restart geo-system --update-env
            elif pm2 describe geo > /dev/null; then
              pm2 restart geo --update-env
            else
              pm2 start ecosystem.config.cjs
            fi
            pm2 save
          REMOTE_SCRIPT

      - name: Clean up deployment credentials
        if: always()
        run: |
          rm -f \
            "${RUNNER_TEMP:-$HOME/.ssh}/geo_ecs_key" \
            "${RUNNER_TEMP:-$HOME/.ssh}/geo_ecs_known_hosts"
