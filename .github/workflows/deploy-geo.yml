name: Deploy geo-strategy-system to ECS

on:
  push:
    branches: [main]
    paths:
      - "geo-strategy-system/**"
      - ".github/workflows/deploy-geo.yml"
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label used for this deployment"
        required: false
        default: "ubuntu-latest"
        type: string
      import_ai_credentials:
        description: "Securely import and verify the temporary AI credential workbook"
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: geo-strategy-system/package-lock.json

      - name: Validate application types
        working-directory: geo-strategy-system
        run: |
          npm ci --include=dev
          npx tsc --noEmit
          npm run test:agent-api
          npm run test:agent-mcp
          npm run test:agent-cli
          npm run test:client-feedback
          npm run test:feedback-automation
          npm run test:ai-credential-pool
          npm run test:ai-credential-adapter
          npm run test:penetration-web
          npm run test:penetration-blind-contract
          npm run test:penetration-selective-retry
          npm run test:penetration-v3

      - name: Upload source to ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_SSH_PORT: ${{ secrets.ECS_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          for required in ECS_HOST ECS_USER ECS_SSH_KEY; do
            if [ -z "${!required:-}" ]; then
              echo "::error::$required secret is not configured"
              exit 1
            fi
          done

          PORT="${ECS_SSH_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/geo-strategy-system/geo-system-v1}"
          REMOTE_APP_DIR="${DEPLOY_PATH%/}/geo-strategy-system"
          printf -v REMOTE_APP_DIR_Q '%q' "$REMOTE_APP_DIR"
          KEY_FILE="${RUNNER_TEMP:-$HOME/.ssh}/geo_ecs_key"
          KNOWN_HOSTS_FILE="${RUNNER_TEMP:-$HOME/.ssh}/geo_ecs_known_hosts"
          printf -v KEY_FILE_Q '%q' "$KEY_FILE"
          printf -v KNOWN_HOSTS_FILE_Q '%q' "$KNOWN_HOSTS_FILE"
          SSH_OPTS=(
            -i "$KEY_FILE"
            -p "$PORT"
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE"
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
          )
          SSH_RSYNC="ssh -i $KEY_FILE_Q -p $PORT -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$KNOWN_HOSTS_FILE_Q -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2"

          mkdir -p "$(dirname "$KEY_FILE")"
          printf '%s\n' "$ECS_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          ssh_ok=0
          for attempt in 1 2 3 4 5 6; do
            if ssh "${SSH_OPTS[@]}" "$ECS_USER@$ECS_HOST" true; then
              ssh_ok=1
              break
            fi
            echo "SSH connection failed (attempt $attempt/6); retrying..."
            sleep $((attempt * 10))
          done
          if [ "$ssh_ok" -ne 1 ]; then
            echo "::error::Unable to reach the ECS SSH port. Check the ECS public IP, security group SSH ingress, and instance status."
            exit 1
          fi

          ssh "${SSH_OPTS[@]}" "$ECS_USER@$ECS_HOST" "mkdir -p $REMOTE_APP_DIR_Q"
          upload_ok=0
          for attempt in 1 2 3; do
            if rsync -az --delete \
              --timeout=60 \
              --contimeout=20 \
              --exclude 'node_modules' \
              --exclude '.next' \
              --exclude '.env.local' \
              --exclude '.env.production' \
              -e "$SSH_RSYNC" \
              geo-strategy-system/ "$ECS_USER@$ECS_HOST:$REMOTE_APP_DIR/"; then
              upload_ok=1
              break
            fi
            echo "Source upload failed (attempt $attempt/3); retrying..."
            sleep $((attempt * 10))
          done
          if [ "$upload_ok" -ne 1 ]; then
            echo "::error::Unable to upload source to ECS after retries."
            exit 1
          fi

      - name: Build and restart application
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_SSH_PORT: ${{ secrets.ECS_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          PORT="${ECS_SSH_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/geo-strategy-system/geo-system-v1}"
          KEY_FILE="${RUNNER_TEMP:-$HOME/.ssh}/geo_ecs_key"
          KNOWN_HOSTS_FILE="${RUNNER_TEMP:-$HOME/.ssh}/geo_ecs_known_hosts"
          printf -v DEPLOY_PATH_Q '%q' "$DEPLOY_PATH"

          ssh \
            -i "$KEY_FILE" \
            -p "$PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            "$ECS_USER@$ECS_HOST" \
            "DEPLOY_PATH=$DEPLOY_PATH_Q bash -s" <<'REMOTE_SCRIPT'
            set -euo pipefail
            cd "$DEPLOY_PATH"

            APP_DIR="${DEPLOY_PATH%/}/geo-strategy-system"
            if [ ! -f "$APP_DIR/package.json" ] || ! grep -q '"name"[[:space:]]*:[[:space:]]*"geo-strategy-system"' "$APP_DIR/package.json"; then
              echo "Could not find geo-strategy-system package.json at $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"

            ENV_FILE=""
            for candidate in "$APP_DIR/.env.production" "$APP_DIR/../.env.production" "$DEPLOY_PATH/.env.production" "$DEPLOY_PATH/../.env.production"; do
              if [ -f "$candidate" ]; then
                ENV_FILE="$candidate"
                break
              fi
            done

            if [ -n "$ENV_FILE" ]; then
              set -a
              # shellcheck disable=SC1091
              source "$ENV_FILE"
              set +a
            else
              echo "Warning: .env.production not found; using existing environment"
            fi

            if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
              npm ci --include=dev
            else
              npm install
            fi

            if [ -n "${DATABASE_URL:-}" ]; then
              npm run db:migrate:system-outputs
              npm run db:migrate:penetration-automation
              npm run db:migrate:feedback-automation
            fi

            GEO_LOW_MEMORY_BUILD=1 \
              GEO_SKIP_BUILD_TYPECHECK=1 \
              NODE_OPTIONS=--max-old-space-size=3072 \
              npm run build

            pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save
          REMOTE_SCRIPT

      - name: Securely import and verify AI credentials
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.import_ai_credentials }}
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_PORT: ${{ secrets.ECS_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          AI_CREDENTIAL_IMPORT_XLSX_B64: ${{ secrets.AI_CREDENTIAL_IMPORT_XLSX_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${AI_CREDENTIAL_IMPORT_XLSX_B64:-}" ]; then
            echo "::error::AI_CREDENTIAL_IMPORT_XLSX_B64 secret is not configured"
            exit 1
          fi

          PORT="${ECS_SSH_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/geo-strategy-system/geo-system-v1}"
          KEY_FILE="${RUNNER_TEMP:-$HOME/.ssh}/geo_ecs_key"
          KNOWN_HOSTS_FILE="${RUNNER_TEMP:-$HOME/.ssh}/geo_ecs_known_hosts"
          LOCAL_IMPORT_FILE="${RUNNER_TEMP:-/tmp}/geo_ai_credentials.xlsx"
          REMOTE_IMPORT_FILE="/tmp/geo_ai_credentials_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.xlsx"
          printf -v DEPLOY_PATH_Q '%q' "$DEPLOY_PATH"
          printf -v REMOTE_IMPORT_FILE_Q '%q' "$REMOTE_IMPORT_FILE"

          umask 077
          printf '%s' "$AI_CREDENTIAL_IMPORT_XLSX_B64" | base64 --decode > "$LOCAL_IMPORT_FILE"
          scp \
            -i "$KEY_FILE" \
            -P "$PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o ConnectTimeout=20 \
            "$LOCAL_IMPORT_FILE" \
            "$ECS_USER@$ECS_HOST:$REMOTE_IMPORT_FILE"

          ssh \
            -i "$KEY_FILE" \
            -p "$PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$ECS_USER@$ECS_HOST" \
            "DEPLOY_PATH=$DEPLOY_PATH_Q IMPORT_FILE=$REMOTE_IMPORT_FILE_Q bash -s" <<'REMOTE_SCRIPT'
            set -euo pipefail
            umask 077
            cleanup_import() {
              rm -f "$IMPORT_FILE"
            }
            trap cleanup_import EXIT
            chmod 600 "$IMPORT_FILE"

            APP_DIR="${DEPLOY_PATH%/}/geo-strategy-system"
            cd "$APP_DIR"
            ENV_FILE=""
            for candidate in "$APP_DIR/.env.production" "$APP_DIR/../.env.production" "$DEPLOY_PATH/.env.production" "$DEPLOY_PATH/../.env.production"; do
              if [ -f "$candidate" ]; then
                ENV_FILE="$candidate"
                break
              fi
            done
            if [ -n "$ENV_FILE" ]; then
              set -a
              # shellcheck disable=SC1091
              source "$ENV_FILE"
              set +a
            fi

            NODE_OPTIONS=--conditions=react-server npx tsx \
              scripts/import-ai-credentials-from-xlsx.mts \
              --file "$IMPORT_FILE" \
              --apply
            npm run ai-credentials:verify -- --enable-passed --strict-web
          REMOTE_SCRIPT

          rm -f "$LOCAL_IMPORT_FILE"

      - name: Remove temporary AI workbook
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.import_ai_credentials }}
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_PORT: ${{ secrets.ECS_SSH_PORT }}
        run: |
          PORT="${ECS_SSH_PORT:-22}"
          KEY_FILE="${RUNNER_TEMP:-$HOME/.ssh}/geo_ecs_key"
          KNOWN_HOSTS_FILE="${RUNNER_TEMP:-$HOME/.ssh}/geo_ecs_known_hosts"
          REMOTE_IMPORT_FILE="/tmp/geo_ai_credentials_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.xlsx"
          printf -v REMOTE_IMPORT_FILE_Q '%q' "$REMOTE_IMPORT_FILE"
          if [ -f "$KEY_FILE" ]; then
            ssh \
              -i "$KEY_FILE" \
              -p "$PORT" \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
              -o ConnectTimeout=20 \
              "$ECS_USER@$ECS_HOST" \
              "rm -f $REMOTE_IMPORT_FILE_Q" || true
          fi

      - name: Clean up deployment credentials
        if: always()
        run: |
          rm -f \
            "${RUNNER_TEMP:-$HOME/.ssh}/geo_ecs_key" \
            "${RUNNER_TEMP:-$HOME/.ssh}/geo_ecs_known_hosts" \
            "${RUNNER_TEMP:-/tmp}/geo_ai_credentials.xlsx"
