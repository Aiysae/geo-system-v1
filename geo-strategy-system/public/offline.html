<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0637A6" />
    <title>势途 GEO · 网络暂不可用</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #020b2d;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      main { width: min(100%, 520px); }
      .brand { color: #8be9ff; font-size: 13px; font-weight: 700; }
      h1 { margin: 18px 0 12px; font-size: clamp(28px, 7vw, 44px); line-height: 1.15; letter-spacing: 0; }
      p { margin: 0; color: #c8dfff; font-size: 15px; line-height: 1.8; }
      button {
        margin-top: 28px;
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        padding: 0 20px;
        background: #fff;
        color: #052b66;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #8be9ff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">SHITU · 势途 GEO</div>
      <h1>网络暂时不可用</h1>
      <p>已创建的云端任务不会因为页面断网而中断。恢复网络后重新连接，即可继续查看任务状态与历史结果。</p>
      <button type="button" onclick="window.location.reload()">重新连接</button>
    </main>
  </body>
</html>
